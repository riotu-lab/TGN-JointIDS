[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgn-jointids"
version = "1.0.0"
description = "TGN-JointIDS: temporal host memory for real-time graph-based intrusion detection under class imbalance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "torch>=2.1", "torch_geometric>=2.4", "numpy>=1.24", "pandas>=2.0",
  "scikit-learn>=1.3", "matplotlib>=3.7", "tqdm>=4.65", "PyYAML>=6.0",
]

[project.optional-dependencies]
baselines = ["xgboost>=2.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["tgn_jointids*"]
