# =============================================================================
# TGN-JointIDS — NF-CICIDS2018-v3 (external validation, Section 5.10)
# Defaults reproduce the configuration used for the reported results.
# =============================================================================
experiment_name: nf_cicids2018_v3

paths:
  flows_csv: data/raw/NF-CICIDS2018-v3_resampled_by_rarity.csv
  graphs: data/processed/nf_cicids2018_v3_graphs.pt
  output_dir: results/nf_cicids2018_v3

data:
  benign_label: benign
  # Fixed class order -> stable label ids across runs (0 must be benign).
  # Label strings as they appear (lower-cased) in the v3 CSV, incl. the dataset's
  # own spelling 'infilteration'.
  classes:
    - benign
    - ftp-bruteforce
    - ssh-bruteforce
    - dos_attacks-goldeneye
    - dos_attacks-slowloris
    - dos_attacks-slowhttptest
    - dos_attacks-hulk
    - ddos_attacks-loic-http
    - ddos_attack-loic-udp
    - ddos_attack-hoic
    - brute_force_-web
    - brute_force_-xss
    - sql_injection
    - infilteration
    - bot
  balance_target: 120000        # flows per class after re-sampling
  balance_seed: 42

features:
  # 13 statistical descriptors.
  statistical:
    - IN_BYTES
    - IN_PKTS
    - OUT_BYTES
    - OUT_PKTS
    - TCP_FLAGS
    - FLOW_DURATION_MILLISECONDS
    - SRC_TO_DST_AVG_THROUGHPUT
    - DST_TO_SRC_AVG_THROUGHPUT
    - NUM_PKTS_UP_TO_128_BYTES
    - NUM_PKTS_128_TO_256_BYTES
    - NUM_PKTS_256_TO_512_BYTES
    - NUM_PKTS_512_TO_1024_BYTES
    - NUM_PKTS_1024_TO_1514_BYTES
  behavioral:                   # 8 inter-arrival-time descriptors
    - SRC_TO_DST_IAT_MIN
    - SRC_TO_DST_IAT_MAX
    - SRC_TO_DST_IAT_AVG
    - SRC_TO_DST_IAT_STDDEV
    - DST_TO_SRC_IAT_MIN
    - DST_TO_SRC_IAT_MAX
    - DST_TO_SRC_IAT_AVG
    - DST_TO_SRC_IAT_STDDEV
  edge: [IN_BYTES, OUT_BYTES, FLOW_DURATION_MILLISECONDS, TCP_FLAGS]

graph:
  window_ms: 5000               # W = 5 s
  stride_ms: 2500               # S = 2.5 s (50 % overlap)
  temporal_dim: 8
  structural_features: true
  use_edge_types: true
  edge_decay: 0.1               # λ_e, Eq. 1
  priority_classes: [brute_force_-xss, brute_force_-web, sql_injection]   # Eq. 4

split:
  train_ratio: 0.60
  val_ratio: 0.15               # stream = remaining 0.25
  seed: 42
  sort_by: null                 # null = as reported; "window_id" = re-sort each subset in time

model:
  hidden_dim: 192
  memory_dim: 96
  num_layers: 3
  num_heads: 4
  dropout: 0.25
  sagpool_ratio: 0.6

memory:
  decay: 0.98                   # γ, Eq. 6
  alpha: 0.7                    # α, Eq. 7

loss:
  lambda_bin: 1.0
  lambda_multi: 0.7
  lambda_node: 0.2
  focal_gamma: 2.0
  label_smoothing: 0.05
  ens_beta: 0.9999
  ens_beta_binary: 0.999
  ens_cap_ratio: 30.0
  ens_source: train_graphs      # graph-level label counts on the training split

training:
  epochs: 150
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  min_lr: 1.0e-5
  scheduler_patience: 10
  early_stopping_patience: 30
  early_stopping_min_delta: 5.0e-4
  grad_clip: 1.0
  seeds: [13, 42, 123, 777, 2026]

continual:
  update_interval: 32           # K
  lambda_ewc: 150
  ewc_n_graphs: 2000
  ewc_batch_size: 16
  warmup_batch_size: 16
  replay:
    mode: class_specific                  
    fifo_capacity: 5000
    min_per_class: 10           
    extra_capacity: 2000         
    batch_size: 64
  alert_threshold: 0.85      

evaluation:
  tracked_classes: [dos_attacks-hulk, brute_force_-web, brute_force_-xss, sql_injection]
  thresholds: [0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95]
  rolling_window: 500
