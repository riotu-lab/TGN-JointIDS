# =============================================================================
# TGN-JointIDS - NF-CICIDS2018-v3 (15 classes), 60 s block-stratified split (60/15/25), every
# class in every partition. Same architecture and training protocol as NF-ToN-IoT-v3; only the
# classes, the mixed-window priority order and the data paths differ.
# Test blocks share attack sessions (and, for FTP/SSH/DoS, the single attacker IP) with
# training blocks: this measures recognition of known attack campaigns.
# Flows: scripts/prepare_flows.py --frac 0.2 --min-flows 200000 --seed 42 on the official file
# (classes with >= 200k flows keep 20%, the others are kept whole; 4,571,570 flows).
# Build: python scripts/build_graphs_cicids.py --config <this>.
# Model: TGN-JointIDS - IP-keyed GRU memory (reset every 60 s block, trained with truncated BPTT,
# K = 24, 32 chronological lanes) + 3-layer edge-aware GAT + SAGPool + binary / attack-type /
# node heads, ENS-weighted focal loss. Fixed budget: 7,000 updates, cosine LR 1e-3 -> 1e-5,
# validation every 100 updates, checkpoint = best validation macro-F1.
# Variants used in the paper (command-line overrides, see README.md):
#   Graph-only  memory.arm=graph_only        w/o ENS    loss.multi_weighting=none
#   Frozen GRU  memory.arm=frozen_gru        w/o focal  loss.focal_gamma=0.0
# =============================================================================
experiment_name: nf_cicids2018_v3
paths:
  flows_csv: data/raw/NF-CICIDS2018-v3_common20_rare100.csv
  graphs: data/processed/nf_cicids2018_v3.pt
  output_dir: results/nf_cicids2018_v3/tgn_jointids
data:
  benign_label: benign
  strict_labels: true
  classes:
  - benign
  - ftp-bruteforce
  - ssh-bruteforce
  - dos_attacks-goldeneye
  - dos_attacks-slowloris
  - dos_attacks-slowhttptest
  - dos_attacks-hulk
  - ddos_attacks-loic-http
  - ddos_attack-loic-udp
  - ddos_attack-hoic
  - brute_force_-web
  - brute_force_-xss
  - sql_injection
  - infilteration
  - bot
  heldout_classes: []
  balance_target: null
  balance_seed: 42
features:
  statistical:
  - IN_BYTES
  - IN_PKTS
  - OUT_BYTES
  - OUT_PKTS
  - TCP_FLAGS
  - FLOW_DURATION_MILLISECONDS
  - SRC_TO_DST_AVG_THROUGHPUT
  - DST_TO_SRC_AVG_THROUGHPUT
  - NUM_PKTS_UP_TO_128_BYTES
  - NUM_PKTS_128_TO_256_BYTES
  - NUM_PKTS_256_TO_512_BYTES
  - NUM_PKTS_512_TO_1024_BYTES
  - NUM_PKTS_1024_TO_1514_BYTES
  behavioral:
  - SRC_TO_DST_IAT_MIN
  - SRC_TO_DST_IAT_MAX
  - SRC_TO_DST_IAT_AVG
  - SRC_TO_DST_IAT_STDDEV
  - DST_TO_SRC_IAT_MIN
  - DST_TO_SRC_IAT_MAX
  - DST_TO_SRC_IAT_AVG
  - DST_TO_SRC_IAT_STDDEV
  edge:
  - IN_BYTES
  - OUT_BYTES
  - FLOW_DURATION_MILLISECONDS
  - TCP_FLAGS
  normalization:
    mode: log1p_zscore
graph:
  window_ms: 5000
  stride_ms: 2500
  temporal_dim: 8
  structural_features: true
  use_edge_types: true
  edge_decay: 0.1
  strict_features: true
  # Mixed-attack windows (only web / XSS / SQL injection co-occur, 22 Feb): rarest class
  # first, by official flow count (sql_injection 440 < xss 480 < web 1,618); the build
  # script verifies the same order on the training partition and counts affected windows.
  priority_classes:
  - sql_injection
  - brute_force_-xss
  - brute_force_-web
split:
  protocol: block_stratified
  train_ratio: 0.6
  val_ratio: 0.15
  seed: 42
  sort_by: window_id
  block_ms: 60000
model:
  hidden_dim: 192
  memory_dim: 96
  num_layers: 3
  num_heads: 4
  dropout: 0.25
  sagpool_ratio: 0.6
memory:
  mode: tbptt
  arm: trainable
  unit_ms: 60000
  tbptt_k: 24
  alpha: 0.7
  decay: 1.0
loss:
  lambda_bin: 1.0
  lambda_multi: 0.7
  lambda_node: 0.2
  focal_gamma: 2.0
  label_smoothing: 0.05
  ens_beta: 0.9999
  ens_beta_binary: 0.999
  ens_cap_ratio: 30.0
  ens_source: train_graphs
  focal_impl: standard
training:
  epochs: 40
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  min_lr: 1.0e-05
  scheduler_patience: 10
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0005
  grad_clip: 1.0
  seeds:
  - 13
  - 42
  - 123
  - 777
  - 2026
  selection_metric: val_macro_f1
  lanes: 32
  eval_lanes: 256
  schedule_seed: null
  train_eval_units: 200
  lr_schedule: cosine
  max_updates: 7000
  eval_every_updates: 100
